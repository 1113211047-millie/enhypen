<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DARK MOON: 4K 節奏音遊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #1d0b18 0%, #08080c 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 360px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 77, 109, 0.35);
            border-radius: 10px;
        }
        .title { font-weight: bold; color: #ff4d6d; letter-spacing: 1px; font-size: 1.05rem; }
        .stats { font-size: 0.95rem; font-weight: bold; }
        #game-box {
            position: relative;
            width: 360px;
            max-width: 95vw;
            height: 520px;
            background: rgba(12, 12, 18, 0.95);
            border: 2px solid #ff4d6d;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.25);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 12, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 10;
        }
        #overlay h2 { font-size: 1.7rem; color: #ff4d6d; margin-bottom: 12px; }
        #overlay p { color: #ccc; font-size: 0.92rem; line-height: 1.6; margin-bottom: 22px; }
        .key-hint {
            display: inline-block;
            background: rgba(255, 77, 109, 0.2);
            border: 1px solid #ff4d6d;
            padding: 2px 8px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            margin: 0 2px;
        }
        button {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
        }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🦇 DARK MOON RHYTHM</div>
        <div class="stats">SCORE: <span id="score">0</span></div>
    </div>

    <div id="game-box">
        <canvas id="gameCanvas" width="360" height="520"></canvas>
        <div id="overlay">
            <h2 id="ov-title">4K 暗夜節奏</h2>
            <p id="ov-desc">
                音符落到下方發光線時按下對應按鍵！<br>
                電腦鍵盤：<span class="key-hint">D</span><span class="key-hint">F</span><span class="key-hint">J</span><span class="key-hint">K</span><br>
                手機平板：直接點擊下方 4 個軌道<br>
                <small style="color:#ff8fa3;">(請開啟喇叭或戴上耳機以聆聽節拍)</small>
            </p>
            <button id="start-btn">開始演奏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const ovTitle = document.getElementById('ov-title');
        const ovDesc = document.getElementById('ov-desc');
        const startBtn = document.getElementById('start-btn');

        const LANES = 4;
        const LANE_WIDTH = canvas.width / LANES;
        const HIT_Y = 440;
        const NOTE_SPEED = 360; // pixels per second
        const KEYS = ['d', 'f', 'j', 'k'];
        const LABELS = ['D', 'F', 'J', 'K'];
        const LANE_COLORS = ['#ff4d6d', '#ff8fa3', '#ff8fa3', '#ff4d6d'];

        let audioCtx = null;
        let isPlaying = false;
        let startTime = 0;
        let notes = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let judgement = { text: '', color: '#fff', alpha: 0 };
        let lanePressed = [false, false, false, false];
        let scheduledStep = 0;
        const BPM = 124;
        const STEP_TIME = 60 / BPM / 2; // eighth note duration
        const TOTAL_STEPS = 64; // ~15.5 seconds per round

        // Web Audio API 簡易合成器（背景節拍 + 打擊音效）
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynthNote(time, freq, duration, type = 'triangle', gainVal = 0.15) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(gainVal, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + duration);
        }

        function playHitSound(lane) {
            if (!audioCtx) return;
            const freqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            playSynthNote(audioCtx.currentTime, freqs[lane], 0.15, 'sine', 0.22);
        }

        function scheduleBGM(elapsed) {
            const currentStep = Math.floor(elapsed / STEP_TIME);
            const bassNotes = [110, 110, 130.81, 146.83, 98, 98, 123.47, 130.81]; // Am - C - Dm - G
            while (scheduledStep <= currentStep + 4 && scheduledStep < TOTAL_STEPS) {
                const playTime = startTime + scheduledStep * STEP_TIME;
                const audioTime = audioCtx.currentTime + (playTime - performance.now() / 1000);
                if (audioTime >= audioCtx.currentTime) {
                    // Kick on even steps
                    if (scheduledStep % 2 === 0) {
                        playSynthNote(audioTime, 65, 0.18, 'sine', 0.25);
                    }
                    // Bassline
                    const noteFreq = bassNotes[Math.floor(scheduledStep / 4) % bassNotes.length];
                    playSynthNote(audioTime, noteFreq, STEP_TIME * 0.9, 'triangle', 0.1);
                }
                scheduledStep++;
            }
        }

        function generateChart() {
            notes = [];
            const leadIn = 1.6; // seconds before first note hits
            for (let step = 0; step < TOTAL_STEPS; step++) {
                // 創造有節奏感的譜面
                if (step % 2 === 0 || (step % 4 === 3 && Math.random() > 0.45)) {
                    const lane = Math.floor(Math.random() * LANES);
                    notes.push({
                        lane: lane,
                        hitTime: leadIn + step * STEP_TIME,
                        hit: false,
                        missed: false
                    });
                }
            }
        }

        function triggerLane(lane) {
            if (!isPlaying) return;
            lanePressed[lane] = true;
            playHitSound(lane);

            const elapsed = performance.now() / 1000 - startTime;
            let targetNote = null;
            let minDiff = Infinity;

            for (const n of notes) {
                if (!n.hit && !n.missed && n.lane === lane) {
                    const diff = Math.abs(n.hitTime - elapsed);
                    if (diff < minDiff) {
                        minDiff = diff;
                        targetNote = n;
                    }
                }
            }

            if (targetNote && minDiff <= 0.16) {
                targetNote.hit = true;
                if (minDiff <= 0.065) {
                    score += 100 + combo * 5;
                    combo++;
                    showJudgement('PERFECT!', '#ffd166');
                } else {
                    score += 50 + combo * 2;
                    combo++;
                    showJudgement('GOOD', '#06d6a0');
                }
                if (combo > maxCombo) maxCombo = combo;
                scoreEl.textContent = score;
            }
        }

        function showJudgement(text, color) {
            judgement = { text, color, alpha: 1.0 };
        }

        // 鍵盤監聽
        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            const idx = KEYS.indexOf(e.key.toLowerCase());
            if (idx !== -1) triggerLane(idx);
        });
        window.addEventListener('keyup', e => {
            const idx = KEYS.indexOf(e.key.toLowerCase());
            if (idx !== -1) lanePressed[idx] = false;
        });

        // 觸控與滑鼠點擊監聽
        function handlePointerDown(clientX) {
            const rect = canvas.getBoundingClientRect();
            const relX = clientX - rect.left;
            const lane = Math.floor((relX / rect.width) * LANES);
            if (lane >= 0 && lane < LANES) {
                triggerLane(lane);
                setTimeout(() => { lanePressed[lane] = false; }, 120);
            }
        }
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            for (const t of e.changedTouches) handlePointerDown(t.clientX);
        }, { passive: false });
        canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX));

        function updateAndDraw() {
            if (!isPlaying) return;
            const elapsed = performance.now() / 1000 - startTime;
            scheduleBGM(elapsed);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製軌道與按壓發光效果
            for (let i = 0; i < LANES; i++) {
                const x = i * LANE_WIDTH;
                if (lanePressed[i]) {
                    const grad = ctx.createLinearGradient(0, HIT_Y - 180, 0, HIT_Y + 40);
                    grad.addColorStop(0, 'rgba(255, 77, 109, 0)');
                    grad.addColorStop(1, 'rgba(255, 77, 109, 0.35)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, HIT_Y - 180, LANE_WIDTH, 220);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();

                // 判定區方框與按鍵提示
                ctx.fillStyle = lanePressed[i] ? '#ff4d6d' : 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(x + 6, HIT_Y - 12, LANE_WIDTH - 12, 24);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(LABELS[i], x + LANE_WIDTH / 2, HIT_Y + 42);
            }

            // 繪製判定線
            ctx.strokeStyle = '#ff4d6d';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, HIT_Y);
            ctx.lineTo(canvas.width, HIT_Y);
            ctx.stroke();
            ctx.lineWidth = 1;

            // 更新與繪製音符
            let remaining = 0;
            for (const n of notes) {
                if (n.hit) continue;
                const timeDiff = n.hitTime - elapsed;
                const y = HIT_Y - timeDiff * NOTE_SPEED;

                if (timeDiff < -0.16 && !n.missed) {
                    n.missed = true;
                    combo = 0;
                    showJudgement('MISS', '#ef476f');
                }

                if (y < canvas.height + 30) {
                    remaining++;
                    if (y > -30) {
                        const x = n.lane * LANE_WIDTH + 8;
                        ctx.fillStyle = LANE_COLORS[n.lane];
                        ctx.shadowColor = LANE_COLORS[n.lane];
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.roundRect(x, y - 10, LANE_WIDTH - 16, 20, 6);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // 繪製 COMBO 與判定文字
            if (combo > 1) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${combo} COMBO`, canvas.width / 2, 160);
            }
            if (judgement.alpha > 0) {
                ctx.fillStyle = judgement.color;
                ctx.globalAlpha = judgement.alpha;
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(judgement.text, canvas.width / 2, 200);
                ctx.globalAlpha = 1;
                judgement.alpha -= 0.03;
            }

            // 曲目結束判定
            if (elapsed > 1.6 + TOTAL_STEPS * STEP_TIME + 1.2 && remaining === 0) {
                endGame();
                return;
            }

            requestAnimationFrame(updateAndDraw);
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            maxCombo = 0;
            scheduledStep = 0;
            scoreEl.textContent = '0';
            generateChart();
            overlay.style.display = 'none';
            startTime = performance.now() / 1000;
            isPlaying = true;
            updateAndDraw();
        }

        function endGame() {
            isPlaying = false;
            ovTitle.textContent = '演奏完成！';
            ovDesc.innerHTML = `最終得分：<strong style="color:#ff4d6d;font-size:1.4rem;">${score}</strong><br>最高連擊：<strong>${maxCombo} COMBO</strong>`;
            startBtn.textContent = '再玩一次';
            overlay.style.display = 'flex';
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
