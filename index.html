<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DARK MOON: 4K 節奏音遊 (長按版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #1d0b18 0%, #08080c 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 360px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 77, 109, 0.35);
            border-radius: 10px;
        }
        .title { font-weight: bold; color: #ff4d6d; letter-spacing: 1px; font-size: 1.05rem; }
        .stats { font-size: 0.95rem; font-weight: bold; }
        #game-box {
            position: relative;
            width: 360px;
            max-width: 95vw;
            height: 520px;
            background: rgba(12, 12, 18, 0.95);
            border: 2px solid #ff4d6d;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.25);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 12, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 10;
        }
        #overlay h2 { font-size: 1.7rem; color: #ff4d6d; margin-bottom: 12px; }
        #overlay p { color: #ccc; font-size: 0.92rem; line-height: 1.6; margin-bottom: 22px; }
        .key-hint {
            display: inline-block;
            background: rgba(255, 77, 109, 0.2);
            border: 1px solid #ff4d6d;
            padding: 2px 8px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            margin: 0 2px;
        }
        button {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
        }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🦇 DARK MOON RHYTHM</div>
        <div class="stats">SCORE: <span id="score">0</span></div>
    </div>

    <div id="game-box">
        <canvas id="gameCanvas" width="360" height="520"></canvas>
        <div id="overlay">
            <h2 id="ov-title">4K 暗夜節奏</h2>
            <p id="ov-desc">
                短音符：落到判定線時點擊<br>
                長條音符：<strong>按住不放</strong>直到尾巴結束！<br>
                按鍵：<span class="key-hint">D</span><span class="key-hint">F</span><span class="key-hint">J</span><span class="key-hint">K</span> 或直接觸控軌道
            </p>
            <button id="start-btn">開始演奏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const ovTitle = document.getElementById('ov-title');
        const ovDesc = document.getElementById('ov-desc');
        const startBtn = document.getElementById('start-btn');

        const LANES = 4;
        const LANE_WIDTH = canvas.width / LANES;
        const HIT_Y = 440;
        const NOTE_SPEED = 360;
        const KEYS = ['d', 'f', 'j', 'k'];
        const LABELS = ['D', 'F', 'J', 'K'];
        const LANE_COLORS = ['#ff4d6d', '#ff8fa3', '#ff8fa3', '#ff4d6d'];

        let audioCtx = null;
        let isPlaying = false;
        let startTime = 0;
        let notes = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let judgement = { text: '', color: '#fff', alpha: 0 };
        let lanePressed = [false, false, false, false];
        let activeTouches = {}; // 追蹤多指觸控對應的軌道
        let scheduledStep = 0;
        const BPM = 124;
        const STEP_TIME = 60 / BPM / 2;
        const TOTAL_STEPS = 72;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynthNote(time, freq, duration, type = 'triangle', gainVal = 0.15) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(gainVal, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + duration);
        }

        function playHitSound(lane, isHold = false) {
            if (!audioCtx) return;
            const freqs = [261.63, 329.63, 392.00, 523.25];
            playSynthNote(audioCtx.currentTime, freqs[lane], isHold ? 0.35 : 0.15, isHold ? 'triangle' : 'sine', 0.22);
        }

        function scheduleBGM(elapsed) {
            const currentStep = Math.floor(elapsed / STEP_TIME);
            const bassNotes = [110, 110, 130.81, 146.83, 98, 98, 123.47, 130.81];
            while (scheduledStep <= currentStep + 4 && scheduledStep < TOTAL_STEPS) {
                const playTime = startTime + scheduledStep * STEP_TIME;
                const audioTime = audioCtx.currentTime + (playTime - performance.now() / 1000);
                if (audioTime >= audioCtx.currentTime) {
                    if (scheduledStep % 2 === 0) {
                        playSynthNote(audioTime, 65, 0.18, 'sine', 0.25);
                    }
                    const noteFreq = bassNotes[Math.floor(scheduledStep / 4) % bassNotes.length];
                    playSynthNote(audioTime, noteFreq, STEP_TIME * 0.9, 'triangle', 0.1);
                }
                scheduledStep++;
            }
        }

        function generateChart() {
            notes = [];
            const leadIn = 1.6;
            const laneFreeStep = [0, 0, 0, 0]; // 確保同軌道音符不會重疊

            for (let step = 0; step < TOTAL_STEPS - 4; step++) {
                if (step % 2 === 0 || (step % 4 === 3 && Math.random() > 0.5)) {
                    const availableLanes = [0, 1, 2, 3].filter(l => step >= laneFreeStep[l]);
                    if (availableLanes.length === 0) continue;

                    const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
                    // 約 30% 機率生成長按滑條音符（長度 2 到 4 拍）
                    const isHold = Math.random() < 0.3 && step < TOTAL_STEPS - 8;
                    const holdSteps = isHold ? (Math.floor(Math.random() * 3) + 2) : 0;

                    notes.push({
                        lane: lane,
                        hitTime: leadIn + step * STEP_TIME,
                        duration: holdSteps * STEP_TIME,
                        isHold: isHold,
                        hit: false,
                        holding: false,
                        completed: false,
                        missed: false,
                        lastTickTime: 0
                    });

                    laneFreeStep[lane] = step + holdSteps + 2;
                }
            }
        }

        function pressLane(lane) {
            if (!isPlaying || lanePressed[lane]) return;
            lanePressed[lane] = true;

            const elapsed = performance.now() / 1000 - startTime;
            let targetNote = null;
            let minDiff = Infinity;

            for (const n of notes) {
                if (!n.hit && !n.missed && n.lane === lane) {
                    const diff = Math.abs(n.hitTime - elapsed);
                    if (diff < minDiff) {
                        minDiff = diff;
                        targetNote = n;
                    }
                }
            }

            if (targetNote && minDiff <= 0.16) {
                targetNote.hit = true;
                playHitSound(lane, targetNote.isHold);

                if (targetNote.isHold) {
                    targetNote.holding = true;
                    targetNote.lastTickTime = elapsed;
                }

                if (minDiff <= 0.065) {
                    score += 100 + combo * 5;
                    combo++;
                    showJudgement('PERFECT!', '#ffd166');
                } else {
                    score += 50 + combo * 2;
                    combo++;
                    showJudgement('GOOD', '#06d6a0');
                }
                if (combo > maxCombo) maxCombo = combo;
                scoreEl.textContent = score;
            } else {
                playHitSound(lane, false);
            }
        }

        function releaseLane(lane) {
            lanePressed[lane] = false;
            if (!isPlaying) return;

            const elapsed = performance.now() / 1000 -
